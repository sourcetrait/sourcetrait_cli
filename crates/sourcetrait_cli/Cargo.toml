[package]
name = "sourcetrait_cli"
version = "2.1.0"
edition = "2024"
description = "Command-line interface for SourceTrait tools"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_cli"
homepage = "https://sourcetrait.com"
categories = ["command-line-utilities"]
keywords = ["sourcetrait", "cli", "srctrait"]

[[bin]]
path = "src/main.rs"
name = "srctrait"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
convert_case.workspace = true
derive_builder.workspace = true
dirs.workspace = true
serde.workspace = true
shellexpand.workspace = true
sourcetrait_chronox.workspace = true
sourcetrait_clapx.workspace = true
sourcetrait_lib_note.workspace = true
sourcetrait_lib_box.workspace = true
sourcetrait_tomlx.workspace = true
snafu.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
sourcetrait_testing.workspace = true
